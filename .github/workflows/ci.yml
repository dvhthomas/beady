# Runs the test suite on every pull request, so a green check means master is
# still releasable, and so the Auto-merge workflow has something real to wait
# for. Release runs the same tests again on the tag; this one catches failures
# before they reach master.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # macos-26 for the same reason as release.yml: its Swift Build backend
    # compiles the String Catalogs; macos-15's Xcode 16 leaves them uncompiled.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: scripts/test.sh
